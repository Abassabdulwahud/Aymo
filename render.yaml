services:
  # ─── FastAPI Backend ──────────────────────────────────────────────────────
  - type: web
    name: aymo-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: starter

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"

      - key: APP_ENV
        value: production

      - key: TASK_ORCHESTRATOR_PROVIDER
        value: background_tasks

      - key: DATABASE_URL
        value: sqlite:///./aymo.db

      - key: TRANSCRIPTION_PROVIDER
        value: openai
      - key: TRANSCRIPTION_MODEL
        value: whisper-1

      - key: UPLOADS_DIR
        value: /opt/render/project/src/uploads
      - key: UPLOADS_BASE_URL
        value: /uploads

      # ── Secrets / Optional Cloud Services (configure in Render Dashboard) ─
      # - key: MONGODB_URL
      #   value: mongodb+srv://<username>:<password>@<cluster>.mongodb.net/aymo?retryWrites=true&w=majority
      # - key: JWT_SECRET_KEY
      #   value: <generate with: python -c "import secrets; print(secrets.token_urlsafe(48))">
      # - key: CLOUDINARY_CLOUD_NAME
      #   value: ...
      # - key: CLOUDINARY_API_KEY
      #   value: ...
      # - key: CLOUDINARY_API_SECRET
      #   value: ...
      # - key: OPENAI_API_KEY
      #   value: ...
      # - key: GEMINI_API_KEY
      #   value: ...
